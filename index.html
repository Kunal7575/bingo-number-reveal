<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>United Way Bingo | Nov 6 | Day 15</title>
<style>
*{box-sizing:border-box}
body{margin:0;width:100vw;height:100vh;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;background:#202124;color:white}
.teams{width:100%;height:100%;position:relative;background:#242424}
.topbar{height:64px;background:#181818;display:flex;align-items:center;padding:0 28px;font-size:20px;font-weight:600;gap:14px}
.logo{background:#6264a7;width:38px;height:38px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900}
.date{margin-left:auto;font-size:13px;color:#dbd8ff;font-weight:600;white-space:nowrap}
.grid{position:absolute;left:40px;right:40px;top:95px;bottom:115px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:15px}
.person{background:#333;border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.avatar{width:105px;height:105px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:600;transition:transform .16s}
.person:nth-child(1) .avatar{background:#8764b8}.person:nth-child(2) .avatar{background:#2b88d8}.person:nth-child(3) .avatar{background:#00b7c3}.person:nth-child(4) .avatar{background:#498205}.person:nth-child(5) .avatar{background:#ca5010}.person:nth-child(6) .avatar{background:#69797e}
.name{position:absolute;bottom:12px;left:15px;font-size:14px}.muted{position:absolute;right:15px;bottom:12px;width:27px;height:27px;border-radius:50%;background:#555;display:flex;align-items:center;justify-content:center;font-size:13px}
.controls{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:13px}
.control{width:51px;height:51px;background:#444;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}.control.end{width:75px;border-radius:25px;background:#c4314b}
.popup{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) scale(.8);background:#fff;color:#222;border-radius:13px;padding:24px 34px;box-shadow:0 20px 70px rgba(0,0,0,.5);font-size:clamp(20px,3vw,30px);font-weight:600;opacity:0;z-index:20;white-space:nowrap;max-width:95vw;text-align:center}
.popup.show{animation:popup 1.1s ease forwards}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}
.glitch{position:fixed;inset:0;background:white;opacity:0;z-index:50;pointer-events:none}.glitch.go{animation:glitchFlash .55s linear}
@keyframes glitchFlash{0%{opacity:0}10%{opacity:.8}20%{opacity:0}35%{opacity:.45}45%{opacity:0}65%{opacity:.8}100%{opacity:0}}
.reveal{position:fixed;inset:0;background:radial-gradient(circle,#6264a7,#242424 65%);z-index:60;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
.reveal.show{opacity:1}.small{font-size:clamp(17px,2.6vw,27px);letter-spacing:4px;margin-bottom:20px;text-align:center;padding:0 12px}
.number{font-size:min(28vw,260px);font-weight:900;transform:scale(0);line-height:1;filter:drop-shadow(0 12px 20px #0004)}
.reveal.show .number{animation:numberBoom .8s cubic-bezier(.15,1.5,.4,1) forwards}
@keyframes numberBoom{0%{transform:scale(0) rotate(-15deg)}70%{transform:scale(1.16) rotate(3deg)}100%{transform:scale(1)}}
.count{position:absolute;bottom:9%;color:#ddd7ff;font-size:18px;letter-spacing:2px}
.final{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#4d4a91,#1b1b29 72%);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
.final.show{display:flex;animation:fade .5s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}
.final h1{font-size:clamp(28px,5vw,54px);margin:0 0 8px}.final p{font-size:clamp(14px,2vw,20px);color:#d8d5ff;margin:0 0 32px}
.ballrow{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(9px,2vw,22px)}
.ball{display:grid;place-items:center;width:clamp(73px,18vw,170px);height:clamp(73px,18vw,170px);border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#e5dafe 52%,#a28be7 100%);box-shadow:0 16px 35px #0006,inset -9px -10px 16px #4735a933;color:#312366;font-weight:900;font-size:clamp(29px,6vw,72px);border:5px solid #ffffffa0;animation:ballUp .65s backwards}
.ball:nth-child(2){animation-delay:.12s}.ball:nth-child(3){animation-delay:.24s}.ball:nth-child(4){animation-delay:.36s}@keyframes ballUp{from{transform:translateY(90px) scale(.4);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.replay{margin-top:34px;border:1px solid #d8ccff;background:#6264a7;color:white;padding:12px 26px;border-radius:24px;font-size:17px;font-weight:700;cursor:pointer}.replay:hover{background:#7375c4}
@media(max-width:650px){.topbar{font-size:14px;padding:0 14px;gap:9px}.date{font-size:10px}.grid{left:12px;right:12px;top:78px;bottom:99px;gap:8px}.person{border-radius:8px}.avatar{width:65px;height:65px;font-size:25px}.name{font-size:11px;bottom:8px;left:8px}.muted{font-size:10px;width:21px;height:21px;right:8px;bottom:8px}.control{width:40px;height:40px;font-size:16px}.controls{bottom:22px}.control.end{width:54px}.popup{white-space:normal;width:max-content;max-width:85vw;padding:15px}.small{letter-spacing:2px}}
@media(prefers-reduced-motion:reduce){.popup.show,.glitch.go,.reveal.show .number,.ball,.final.show{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="teams">
  <div class="topbar"><div class="logo">T</div>Weekly Team Meeting <div class="date">FRIDAY · NOV 6 · BINGO DAY 15</div></div>
  <div class="grid">
    <div class="person"><div class="avatar">KS</div><div class="name">Kunal</div><div class="muted">🎤</div></div>
    <div class="person"><div class="avatar">EB</div><div class="name">Emily</div><div class="muted">🎤</div></div>
    <div class="person"><div class="avatar">CF</div><div class="name">Claire</div><div class="muted">🎤</div></div>
    <div class="person"><div class="avatar">EL</div><div class="name">Eric</div><div class="muted">🎤</div></div>
    <div class="person"><div class="avatar">NA</div><div class="name">Neba</div><div class="muted">🎤</div></div>
    <div class="person"><div class="avatar">AM</div><div class="name">Ade</div><div class="muted">🎤</div></div>
  </div>
  <div class="controls"><div class="control">🎤</div><div class="control">📹</div><div class="control">↗</div><div class="control">•••</div><div class="control end">☎</div></div>
</div>
<div class="popup" id="popup" aria-live="polite"></div>
<div class="glitch" id="glitch"></div>
<div class="reveal" id="reveal" aria-live="polite"><div class="small">FRIDAY, NOV 6 · BINGO NUMBER</div><div class="number" id="number"></div><div class="count" id="count"></div></div>
<div class="final" id="final"><h1>🎉 FRIDAY BINGO!</h1><p>November 6, 2026 · Day 15 · All four calls</p><div class="ballrow"><div class="ball">I30</div><div class="ball">I19</div><div class="ball">N43</div><div class="ball">O62</div></div><button class="replay" id="replay">↻ Replay</button></div>

<script>
// Today's exact four calls, in the correct order.
const BINGO_NUMBERS = ["I30", "I19", "N43", "O62"];
const messages = [
  "You're on mute.",
  "Can everyone see my screen?",
  "Sorry... you go first.",
  "Let's take that offline."
];
const popup = document.getElementById('popup');
const glitch = document.getElementById('glitch');
const reveal = document.getElementById('reveal');
const number = document.getElementById('number');
const count = document.getElementById('count');
const final = document.getElementById('final');
let timers = [], playing = false;
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function showMessage(text){
  popup.textContent=text;popup.classList.remove('show');void popup.offsetWidth;popup.classList.add('show');
}
function doGlitch(){glitch.classList.remove('go');void glitch.offsetWidth;glitch.classList.add('go')}
function showNumber(n,i){
  doGlitch();
  later(()=>{
    number.textContent=n;count.textContent=`CALL ${i+1} OF 4`;
    reveal.classList.remove('show');void reveal.offsetWidth;reveal.classList.add('show');

  },420);
  later(()=>reveal.classList.remove('show'),2200);
}
function reset(){timers.forEach(clearTimeout);timers=[];popup.classList.remove('show');glitch.classList.remove('go');reveal.classList.remove('show');final.classList.remove('show');}
function play(){
  if(playing)return;
  playing=true;reset();
  messages.forEach((msg,i)=>later(()=>showMessage(msg),700+i*1250));
  BINGO_NUMBERS.forEach((num,i)=>later(()=>showNumber(num,i),5850+i*2600));
  later(()=>{reveal.classList.remove('show');final.classList.add('show');playing=false;},16900);
}
window.addEventListener('DOMContentLoaded', play);
document.getElementById('replay').addEventListener('click',play);
</script>
</body>
</html>
